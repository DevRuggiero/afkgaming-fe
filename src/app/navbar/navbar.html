<div class="fixed top-0 left-0 w-full flex items-center p-4 z-50 transition-all duration-300 h-[100px] md:h-[120px]"
  [ngClass]="{
    'bg-gray-900': !scrolled,
    'bg-black/70 backdrop-blur-md': scrolled
  }">
  <!-- Navbar normale -->
  <div *ngIf="!showSearch">
    <a routerLink="/">
      <img src="images/logo.png" alt="Logo" class="h-25 md:h-30 w-auto object-contain" />
    </a>
  </div>

  <!-- Icone a destra + search -->
  <div *ngIf="!showSearch" class="absolute right-6 top-1/2 transform -translate-y-1/2 flex gap-x-6 items-center">

    <!-- 🔹 Icona di ricerca -->
    <button (click)="showSearch = true" class="text-white text-xl md:text-2xl lg:text-3xl cursor-pointer">
      <i class="fa-solid fa-magnifying-glass"></i>
    </button>

    <!-- 🔹 Se non loggato: icona login -->
    <button *ngIf="!auth.isLogged()" routerLink="/login"
      class="text-white text-xl md:text-2xl lg:text-3xl cursor-pointer">
      <i class="fa-solid fa-user"></i>
    </button>

    <button *ngIf="auth.isLogged()" class="text-white text-xl md:text-2xl lg:text-3xl cursor-pointer"
      (click)="toggleCodesModal()">
      <i class="fa-solid fa-tags"></i>
    </button>
    <button class="text-white text-xl md:text-2xl lg:text-3xl relative cursor-pointer" (click)="toggleCart()">
      <i class="fa-solid fa-cart-shopping"></i>

      <span *ngIf="cartCount > 0" class="absolute -top-2 -right-2 bg-red-600 rounded-full px-2 text-sm">
        {{ cartCount }}
      </span>
    </button>
    <button *ngIf="auth.isLogged()" class="text-white text-xl md:text-2xl lg:text-3xl cursor-pointer"
      (click)="logout()">
      <i class="fa-solid fa-right-from-bracket"></i>
    </button>
  </div>


 <!-- Scritta centrale desktop -->
<div *ngIf="!showSearch" class="hidden md:flex md:absolute md:left-1/2 md:top-1/2 md:transform md:-translate-x-1/2 md:-translate-y-1/2">
  <span class="text-white italic md:text-2xl">
    Non conta quanto tempo hai, ma come lo usi ~ Ekko
  </span>
</div>



  <div class="absolute inset-0 flex items-center justify-center z-50 p-4 transition-all duration-300"
    [ngClass]="showSearch ? 'opacity-100 scale-100' : 'opacity-0 scale-95 pointer-events-none'">
    <div class="relative w-full max-w-md">

      <input type="text" [(ngModel)]="searchText" placeholder=" Minecraft, Halo ..."
        class="w-full p-4 pr-12 text-white rounded-md focus:outline-none bg-blue-500 transition-all duration-300"
        (keydown.enter)="searchProducts()" />


      <button *ngIf="searchText" (click)="searchText = ''"
        class="absolute right-10 top-1/2 transform -translate-y-1/2 text-white text-xl" aria-label="Cancella testo">
        <i class="fa-solid fa-backspace"></i>
      </button>


      <button (click)="showSearch = false"
        class="absolute right-2 top-1/2 transform -translate-y-1/2 text-white text-2xl cursor-pointer"
        aria-label="Chiudi ricerca">
        <i class="fa-solid fa-xmark"></i>
      </button>

      <div *ngIf="filteredProducts.length > 0"
        class="absolute top-full mt-2 w-full bg-gray-800 rounded-md shadow-lg max-h-80 overflow-y-auto z-50">
        <div *ngFor="let product of filteredProducts" (click)="goToProduct(product.id)"
          class="flex items-center gap-3 p-2 hover:bg-blue-700 cursor-pointer transition-colors">
          <img [src]="product.img" alt="{{ product.name }}" class="w-10 h-10 object-cover rounded" />
          <span class="text-white">{{ product.name }}</span>
        </div>
      </div>

    </div>
  </div>
</div>

<div class="mt-[100px] md:mt-[120px]">
  <!-- uguale all'altezza navbar -->
  <div class="bg-blue-900 w-full h-12 md:h-16 flex items-center justify-center">
    <div class="flex gap-3 md:gap-7">
      <!-- PC -->
      <a routerLink="/category/pc" routerLinkActive="border-b-2 border-cyan-500"
        class="flex items-center gap-2 text-white transition-colors duration-200">
        <img src="images/pc.png" alt="PC" class="h-4 md:h-6 object-contain" />
        <span>Pc</span>
      </a>
      <!-- PLAYSTATION -->
      <a routerLink="/category/playstation" routerLinkActive="border-b-2 border-blue-500"
        class="flex items-center gap-2 text-white transition-colors duration-200">
        <img src="images/play.png" alt="PlayStation" class="h-4 md:h-6 object-contain" />
        <span>PlayStation</span>
      </a>
      <!-- XBOX -->
      <a routerLink="/category/xbox" routerLinkActive="border-b-2 border-green-600"
        class="flex items-center gap-2 text-white transition-colors duration-200">
        <img src="images/xbox.png" alt="Xbox" class="h-4 md:h-6 object-contain" />
        <span>Xbox</span>
      </a>
      <!-- SWITCH -->
      <a routerLink="/category/switch" routerLinkActive="border-b-2 border-red-600"
        class="flex items-center gap-2 text-white transition-colors duration-200">
        <img src="images/switch.png" alt="Switch" class="h-4 md:h-6 object-contain" />
        <span>Switch</span>
      </a>
    </div>
  </div>

  <div *ngIf="codesModal" class="fixed inset-0 flex justify-center items-center z-50 bg-black/50 px-2 md:px-0"
    (click)="toggleCodesModal()">

    <div
      class="bg-gray-900 text-white rounded-2xl shadow-xl w-full md:w-[32rem] p-4 md:p-6 relative max-h-[80vh] overflow-y-auto"
      (click)="$event.stopPropagation()">

      <!-- Titolo -->
      <h2 class="text-2xl font-bold mb-4 text-blue-900">I tuoi codici</h2>

      <!-- Nessun prodotto acquistato -->
      <div *ngIf="purchasedCodes.length === 0" class="text-gray-300">
        Nessun prodotto acquistato.
      </div>

      <!-- Lista codici con scroll su mobile se troppi -->
      <ul class="mb-4 space-y-2 max-h-64 overflow-y-auto px-3" *ngIf="purchasedCodes.length > 0">
        <li *ngFor="let item of purchasedCodes"
          class="border-b border-gray-700 pb-2 flex flex-col md:flex-row md:justify-between md:items-center">

          <!-- Nome prodotto -->
          <div
            class="font-semibold text-white break-words md:whitespace-nowrap md:truncate md:overflow-hidden mb-1 md:mb-0">
            {{ item.name }}
          </div>

          <!-- Codice prodotto -->
          <div class="font-mono text-white text-sm md:ml-4">{{ item.code }}</div>
        </li>
      </ul>

      <!-- Pulsante chiudi -->
      <button (click)="toggleCodesModal()"
        class="absolute top-3 right-3 text-white text-xl md:text-2xl font-bold cursor-pointer md:text-red-500">
        &times;
      </button>

    </div>
  </div>

  <app-cartmodal *ngIf="showCart" (close)="showCart = false"></app-cartmodal>
</div>

<div class="bg-gray-900">
  <!-- Hero -->
  <section class="relative min-h-[180px]">
    <a
      routerLink="/"
      class="relative block overflow-hidden group [clip-path:polygon(0_0,100%_0,100%_100%,0%_90%)]"
    >
      <img
        src="images/halo-evolved.jpg"
        alt="Prodotto"
        class="w-full h-auto transition-transform duration-500 group-hover:scale-105"
      />
      <div
        class="absolute inset-0 pointer-events-none bg-[linear-gradient(to_top,rgba(0,0,0,0.6),transparent_40%),linear-gradient(to_right,rgba(0,0,0,0.6),transparent_40%),linear-gradient(to_bottom,rgba(0,0,0,0.6),transparent_40%)]"
      ></div>

      <!-- Box testo in alto a destra -->
      <div class="absolute top-4 right-1 text-right text-white space-y-1 text-xs">
        <div class="text-xs">Halo: Campaign Evolved</div>
        <div class="inline-flex items-center space-x-2 gap-2">
          <span class="text-sm bg-blue-600 text-white px-2 py-1 rounded">-20%</span>
          <span class="text-lg font-semibold">56.90 €</span>
        </div>
      </div>
    </a>
  </section>

  <div class="h-16 flex items-center justify-start" style="padding-left: 10px">
    <a
      routerLink="/piu-venduti"
      class="inline-flex items-center gap-2 text-lg font-semibold text-white"
    >
      <span>I PIÙ VENDUTI</span>
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="w-5 h-5"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        stroke-width="2"
      >
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
      </svg>
    </a>
  </div>

  <!-- Section delle card -->
  <section class="relative min-h-[430px]">
    <div class="grid grid-cols-1 gap-7 place-items-center">
      <!-- CARD 1 -->
      <div class="group w-72">
        <a routerLink="/prodotto/halo" class="relative block overflow-hidden rounded-xl shadow-lg">
          <img src="images/halo-evolved.jpg" alt="Halo" class="w-full h-auto" />
          <span
            class="absolute bottom-2 right-2 bg-blue-600 text-white text-xs font-semibold px-2 py-1 rounded"
          >
            -20%
          </span>
        </a>
        <div
          class="flex items-center justify-between text-white text-sm"
          style="margin-top: 10px !important"
        >
          <span>Halo: Campaign Evolved</span>
          <span class="font-semibold text-white">56.90 €</span>
        </div>
      </div>

      <!-- CARD 2 -->
      <div class="group w-72">
        <a routerLink="/prodotto/mario" class="relative block overflow-hidden rounded-xl shadow-lg">
          <img src="images/SuperMarioOdissey.jpg" alt="Mario" class="w-full h-auto" />
          <span
            class="absolute bottom-2 right-2 bg-blue-600 text-white text-xs font-semibold px-2 py-1 rounded"
            >-10%</span
          >
        </a>
        <div
          class="flex items-center justify-between text-white text-sm"
          style="margin-top: 10px !important"
        >
          <span>Super Mario Odyssey</span>
          <span class="font-semibold white">49.90 €</span>
        </div>
      </div>
    </div>
  </section>

  <!-- Sezione valori del sito con icone Font Awesome e spazio sopra -->
  <div class="bg-blue-500 w-full h-16 flex items-center justify-center">
    <div class="flex gap-3 items-center">
      <!-- SICURO con lucchetto -->
      <div class="flex items-center gap-2 text-white text-ms">
        <i class="fas fa-lock w-5 h-5"></i>
        <span>SICURO</span>
      </div>

      <!-- Separatore -->
      <span class="h-9 border-l border-gray-900"></span>

      <!-- AFFIDABILE -->
      <div class="flex items-center gap-2 text-white text-ms">
        <i class="fas fa-check w-5 h-5"></i>
        <span>AFFIDABILE</span>
      </div>

      <!-- Separatore -->
      <span class="h-9 border-l border-gray-900"></span>

      <!-- VELOCE -->
      <div class="flex items-center gap-2 text-white text-ms">
        <i class="fas fa-bolt w-5 h-5"></i>
        <span>VELOCE</span>
      </div>
    </div>
  </div>
</div>

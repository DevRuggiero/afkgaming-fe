<div class="relative flex items-center p-4 bg-black">
  <!-- Logo a sinistra -->
  <div>
    <img src="images/logowithoutbg.png" alt="Logo" class="h-25 w-auto object-contain">
  </div>

  <!-- Hamburger e dropdown -->
  <div class="absolute right-4"> <!-- Spostato più vicino al centro -->
    <button (click)="toggleMenu()" class="flex flex-col justify-between w-8 h-6 focus:outline-none md:hidden">
      <span class="block h-1 w-full bg-white rounded"></span>
      <span class="block h-1 w-full bg-white rounded"></span>
      <span class="block h-1 w-full bg-white rounded"></span>
    </button>

    <div [class.hidden]="!menuOpen"
         class="absolute right-0 translate-y-4  bg-black border border-gray-700 rounded shadow-md w-40 z-50">
      <ul class="flex flex-col w-full">
        <li class="flex justify-center items-center text-white px-4 py-2 cursor-pointer">
          <span>PC</span>
        </li>
        <li class="flex justify-center items-center text-white px-4 py-2 cursor-pointer">
          <span>Xbox</span>
        </li>
        <li class="flex justify-center items-center text-white px-4 py-2 cursor-pointer">
          <span>PlayStation</span>
        </li>
      </ul>
    </div>
  </div>
</div>

<!-- Overlay trasparente -->
<div class="fixed inset-0 flex justify-center items-center z-50 bg-black/50 px-2" (click)="close.emit()">
  <!-- Modale opaco -->
  <div
    class="bg-gray-900 text-white rounded-2xl shadow-xl w-full md:w-96 p-4 md:p-6 relative max-h-[80vh] overflow-y-auto"
    (click)="$event.stopPropagation()">

    <h2 class="text-2xl font-bold mb-4 text-blue-900">Carrello</h2>

    <ul class="mb-4 space-y-2">
      <li *ngFor="let item of getCartSummary()" class="border-b border-gray-700 pb-2">
        {{ item.product.name }} - ( {{ item.quantity }} )
      </li>
    </ul>

    <p class="font-bold mb-4">Totale: {{ cart.getTotal() | number:'1.2-2' }} €</p>

    <div class="flex justify-between gap-x-2">
      <button (click)="svuotaCarrello()"
        class="flex-1 bg-red-600 hover:bg-red-700 py-1.5 px-3 text-sm rounded-lg md:py-2 md:px-4 md:text-base cursor-pointer">
        Svuota Carrello
      </button>

      <button (click)="checkout()"
        class="flex-1 bg-blue-900 hover:bg-blue-800 py-1.5 px-3 text-sm rounded-lg md:py-2 md:px-4 md:text-base cursor-pointer">
        Procedi al Checkout
      </button>
    </div>

    <button (click)="close.emit()"
      class="absolute top-3 right-3 text-white text-xl md:text-2xl font-bold cursor-pointer md:text-red-500">
      &times;
    </button>
  </div>
</div>

<div class="min-h-screen flex flex-col md:flex-row items-center justify-center bg-gray-900 p-4">

    <div class="mb-6 md:mb-0 md:flex-1 flex items-center justify-center">
        <a routerLink="/">
            <img src="images/logo.png" alt="Logo" class="h-auto md:h-auto">
        </a>
    </div>

    <div class="flex-1 flex items-center justify-center w-full">
        <div class="max-w-sm md:max-w-md w-full bg-gray-800 shadow-lg rounded-lg p-6 md:p-10">

            <h1 class="text-2xl md:text-3xl font-bold mb-6 text-white text-center md:text-center">Login Demo</h1>

            <!-- BOX DATI DEMO LOGIN -->
            <div class="bg-blue-50 border-l-4 border-blue-500 p-4 mb-6 rounded">
                <h3 class="font-semibold text-blue-700 mb-2">📌 Dati per la Demo</h3>
                <p class="mb-1"><span class="font-medium">Email: </span> <span class="font-mono">test@test.com</span>
                </p>
                <p><span class="font-medium">Password: </span> <span class="font-mono">123456</span></p>
            </div>

            <!-- FORM LOGIN -->
            <input type="email" [(ngModel)]="email" placeholder="Email"
                class="w-full bg-gray-900 text-white border border-gray-700 p-3 md:p-4 rounded mb-4 text-sm md:text-base focus:outline-none focus:ring-2 focus:ring-blue-700" />

            <div class="relative mb-4">
                <input [type]="showPassword ? 'text' : 'password'" [(ngModel)]="password" placeholder="Password"
                    class="w-full bg-gray-900 text-white border border-gray-700 p-3 md:p-4 rounded text-sm md:text-base focus:outline-none focus:ring-2 focus:ring-blue-700" />
                <button type="button" (click)="showPassword = !showPassword"
                    class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-gray-200 cursor-pointer">
                    <svg *ngIf="!showPassword" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none"
                        viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M2.458 12C3.732 7.943 7.523 5 12 5c4.477 0 8.268 2.943 9.542 7-1.274 4.057-5.065 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                    </svg>
                    <svg *ngIf="showPassword" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none"
                        viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.269-2.944-9.543-7a10.055 10.055 0 012.423-4.042M6.1 6.1A9.956 9.956 0 0112 5c4.478 0 8.269 2.944 9.543 7a10.05 10.05 0 01-1.05 2.026M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                        <path stroke-linecap="round" stroke-linejoin="round" d="M3 3l18 18" />
                    </svg>
                </button>
            </div>

            <button (click)="login()"
                class="w-full bg-blue-900 hover:bg-blue-800 text-white font-bold py-3 md:py-4 rounded mb-4 text-sm md:text-base transition-colors duration-300 cursor-pointer">
                Accedi
            </button>

            <p class="text-red-500 text-sm md:text-base mb-4 text-center md:text-left">{{ message }}</p>

            <a routerLink="/register"
                class="block text-center md:text-center text-white hover:text-blue-400 text-sm md:text-base mt-2 cursor-pointer md:mt-5">
                Non hai un account? Registrati
            </a>
        </div>
    </div>

</div>

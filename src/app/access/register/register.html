<div class="min-h-screen flex flex-col md:flex-row items-center justify-center bg-gray-900 p-4">

    <div class="mb-6 md:mb-0 md:flex-1 flex items-center justify-center">
        <a routerLink="/">
            <img src="images/logo.png" alt="Logo" class="h-auto md:h-auto">
        </a>
    </div>

    <div class="flex-1 flex items-center justify-center w-full">
        <div class="max-w-sm md:max-w-md w-full bg-gray-800 shadow-lg rounded-lg p-6 md:p-10 text-center">
            <h1 class="text-2xl md:text-3xl font-bold mb-6 text-white">Registrazione</h1>

            <p class="text-gray-400 mb-6">{{ message }}</p>

            <button (click)="goToLogin()"
                class="w-full bg-blue-900 hover:bg-blue-800 text-white font-bold py-3 md:py-4 rounded transition-colors duration-300 cursor-pointer">
                Vai al Login
            </button>
        </div>
    </div>

</div>
